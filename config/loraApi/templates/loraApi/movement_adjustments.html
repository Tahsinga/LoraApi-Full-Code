<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lora | Movement adjustment history</title>
  <style>
    :root { --ink:#182326; --muted:#6d7b7d; --line:#dbe3df; --paper:#f5f7f4; --white:#fff; --teal:#087f78; --teal-dark:#075d5a; --coral:#d95f4d; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font-family:Georgia,'Times New Roman',serif; }
    .shell { min-height:100vh; background:radial-gradient(circle at 90% 0,#dceee7 0,transparent 34%),linear-gradient(135deg,#f8faf7 0,#edf3ef 100%); }
    header, main { max-width:1280px; margin:auto; padding-left:28px; padding-right:28px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:24px; padding-top:40px; padding-bottom:28px; }
    .eyebrow { margin:0 0 8px; color:var(--teal); font:700 12px/1.2 Arial,sans-serif; text-transform:uppercase; }
    h1 { margin:0; font-size:42px; line-height:1; font-weight:500; }
    .nav { display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:flex-end; }
    .nav a, .logout-button { color:var(--teal-dark); font:700 12px Arial,sans-serif; text-decoration:none; text-transform:uppercase; }
    .nav a:hover, .logout-button:hover { color:var(--coral); }
    .logout-form { display:inline; margin:0; }
    .logout-button { padding:0; background:none; border:0; cursor:pointer; }
    main { padding-bottom:48px; }
    .filters { display:grid; grid-template-columns:minmax(200px,.8fr) minmax(220px,1.4fr) repeat(2,minmax(145px,.7fr)) auto; gap:12px; align-items:end; }
    label { display:flex; flex-direction:column; gap:7px; color:#435153; font:700 11px Arial,sans-serif; text-transform:uppercase; }
    input, select { width:100%; min-width:0; height:44px; padding:10px 12px; color:var(--ink); background:#fbfcfa; border:1px solid #cbd7d2; border-radius:3px; font:15px Georgia,serif; }
    input:focus, select:focus { border-color:var(--teal); outline:2px solid #d9efeb; }
    button { height:44px; padding:0 16px; color:white; background:var(--teal); border:0; border-radius:3px; cursor:pointer; font:700 11px Arial,sans-serif; text-transform:uppercase; }
    button:hover { background:var(--teal-dark); }
    .audit-status { min-height:22px; margin:16px 0 10px; color:var(--muted); font:13px Arial,sans-serif; }
    .table-wrap { overflow:auto; background:var(--white); border:1px solid var(--line); border-radius:5px; }
    table { width:100%; min-width:980px; border-collapse:collapse; }
    th { padding:12px; color:var(--muted); border-bottom:1px solid var(--line); text-align:left; font:700 10px Arial,sans-serif; text-transform:uppercase; }
    td { padding:12px; border-bottom:1px solid var(--line); font:13px Arial,sans-serif; vertical-align:top; }
    tr:last-child td { border-bottom:0; }
    .product { font:15px Georgia,serif; }
    .product small { display:block; margin-top:4px; color:var(--muted); font:11px Arial,sans-serif; }
    .status { display:inline-block; padding:5px 8px; border-radius:4px; background:#eef2ef; color:#53605e; font:700 10px Arial,sans-serif; text-transform:uppercase; }
    .status.completed { background:#e3f3e9; color:#17633f; }
    .status.in_progress, .status.pending { background:#fff1c2; color:#805500; }
    .status.failed { background:#fde8e5; color:#a33229; }
    .empty { padding:22px; color:var(--muted); font:14px Arial,sans-serif; }
    @media (max-width:850px) {
      header { display:block; padding:26px 16px 22px; }
      .nav { justify-content:flex-start; margin-top:18px; }
      h1 { font-size:36px; }
      main { padding:0 14px 32px; }
      .filters { grid-template-columns:1fr 1fr; }
      .filters label:nth-child(2) { grid-column:1/-1; }
      .filters button { grid-column:1/-1; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><p class="eyebrow">Lora operations</p><h1>Movement adjustment history</h1></div>
    <nav class="nav"><a href="/stock/">Main stock</a><a href="/stock/movements/history/">Product movements</a><a href="/">Sale control</a><form method="post" action="/logout/" class="logout-form">{% csrf_token %}<button type="submit" class="logout-button">Sign out</button></form></nav>
  </header>
  <main>
    <form id="adjustment-filters" class="filters">
      <label>Branch<select id="branch-filter"><option value="">All branches</option></select></label>
      <label>Search<input id="adjustment-search" type="search" placeholder="Product, ID, branch, or user"></label>
      <label>From<input id="from-date" type="date"></label>
      <label>To<input id="to-date" type="date"></label>
      <button type="submit">Refresh</button>
    </form>
    <p id="audit-status" class="audit-status" role="status" aria-live="polite">Loading movement adjustments...</p>
    <div id="audit-table" class="table-wrap"><p class="empty">Loading...</p></div>
  </main>
</div>
<script>
  const filterForm = document.querySelector('#adjustment-filters');
  const branchFilter = document.querySelector('#branch-filter');
  const searchInput = document.querySelector('#adjustment-search');
  const fromInput = document.querySelector('#from-date');
  const toInput = document.querySelector('#to-date');
  const now = new Date();
  const today = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
  fromInput.value = today;
  toInput.value = today;
  const auditStatus = document.querySelector('#audit-status');
  const auditTable = document.querySelector('#audit-table');
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
  const formatDate = value => value ? new Intl.DateTimeFormat(undefined, {dateStyle:'medium', timeStyle:'short'}).format(new Date(value)) : 'Not completed';

  function renderAdjustments(rows) {
    auditTable.innerHTML = rows.length
      ? `<table><thead><tr><th>Branch</th><th>Product</th><th>Movement target</th><th>Done by</th><th>Requested</th><th>Completed</th><th>Status</th></tr></thead><tbody>${rows.map(row => {
        const status = ['completed','in_progress','pending','failed','cancelled'].includes(row.status) ? row.status : 'failed';
        const statusLabel = status.replace('_', ' ');
        return `<tr><td>${escapeHtml(row.branch)}</td><td class="product">${escapeHtml(row.product_name)}<small>ID ${escapeHtml(row.product_id)}</small></td><td><strong>${escapeHtml(row.quantity)}</strong></td><td>${escapeHtml(row.created_by)}</td><td>${escapeHtml(formatDate(row.created_at))}</td><td>${escapeHtml(formatDate(row.completed_at))}</td><td><span class="status ${status}">${escapeHtml(statusLabel)}</span></td></tr>`;
      }).join('')}</tbody></table>`
      : '<p class="empty">No movement adjustments match these filters.</p>';
  }

  async function loadAdjustments() {
    const params = new URLSearchParams();
    if (branchFilter.value) params.set('branch', branchFilter.value);
    if (searchInput.value.trim()) params.set('q', searchInput.value.trim());
    if (fromInput.value) params.set('from', fromInput.value);
    if (toInput.value) params.set('to', toInput.value);
    auditStatus.textContent = 'Loading movement adjustments...';
    try {
      const response = await fetch(`/api/stock/movement-adjustments/history/?${params}`, {cache:'no-store'});
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'History unavailable.');
      const knownBranch = branchFilter.value;
      branchFilter.innerHTML = '<option value="">All branches</option>' + (data.branches || []).map(branch => `<option value="${escapeHtml(branch)}">${escapeHtml(branch)}</option>`).join('');
      if ((data.branches || []).includes(knownBranch)) branchFilter.value = knownBranch;
      renderAdjustments(data.adjustments || []);
      auditStatus.textContent = data.truncated
        ? `Showing the latest ${data.count} of ${data.total} matching movement adjustments.`
        : `${data.total} movement adjustment${data.total === 1 ? '' : 's'} found.`;
    } catch (error) {
      auditTable.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
      auditStatus.textContent = 'Movement adjustment history unavailable.';
    }
  }

  filterForm.addEventListener('submit', event => { event.preventDefault(); loadAdjustments(); });
  loadAdjustments();
</script>
</body>
</html>
